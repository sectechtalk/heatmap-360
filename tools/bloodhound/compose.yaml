# BloodHound Community Edition for HeatMap 360 (attack paths). Local only.
name: hm360-bloodhound
services:
  app-db:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      - PGUSER=bloodhound
      - POSTGRES_USER=bloodhound
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
      - POSTGRES_DB=bloodhound
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodhound -d bloodhound -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  graph-db:
    image: docker.io/library/neo4j:4.4.42
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_SECRET:?set in .env}
      - NEO4J_dbms_allow__upgrade=true
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1g
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bloodhound:
    image: docker.io/specterops/bloodhound:9.9.2
    restart: unless-stopped
    environment:
      - bhe_disable_cypher_complexity_limit=false
      - bhe_enable_cypher_mutations=false
      - bhe_graph_query_memory_limit=2
      - bhe_database_connection=user=bloodhound password=${POSTGRES_PASSWORD} dbname=bloodhound host=app-db
      - bhe_neo4j_connection=neo4j://neo4j:${NEO4J_SECRET}@graph-db:7687/
      - bhe_default_admin_principal_name=admin
      - bhe_default_admin_password=${BH_ADMIN_PASSWORD:?set in .env}
      - bhe_recreate_default_admin=false
      - bhe_graph_driver=neo4j
    ports:
      - 127.0.0.1:3461:8080
    depends_on:
      app-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy

volumes:
  neo4j-data:
  postgres-data:

# Modelled on a winget defaultLocale manifest (Mozilla.Firefox 132.0) with a publisher "Unresolved" section added.
PackageIdentifier: Mozilla.Firefox
PackageVersion: "132.0"
PackageLocale: en-US
Publisher: Mozilla
PackageName: Mozilla Firefox
ShortDescription: Mozilla Firefox is free and open source software.
ReleaseNotes: |-
  New
  - Wide Color Gamut WebGL is now available for Windows and macOS users!

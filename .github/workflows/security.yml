# Security gate (360 standard, 2026-11-15). Runs on every PR, on main, and weekly so new advisories surface.
# $0: free tools only. Actions are pinned to commit SHAs; Dependabot keeps them current.
name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
# One runner: a newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  dependency-audit:
    # Fails on a high or critical advisory in a package the running app loads (dev tools are not shipped).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
  secret-scan:
    # Fails when a key, token or password is committed anywhere in the history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The official gitleaks release is downloaded, checked against its published SHA-256 and run over the whole
      # history (no third-party action needed).
      - name: gitleaks (whole history)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks-$GITLEAKS_VERSION"
          mkdir -p "$dir"
          curl -fsSL -o "$dir.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $dir.tar.gz" | sha256sum -c -
          tar -xzf "$dir.tar.gz" -C "$dir" gitleaks
          "$dir/gitleaks" git --redact --no-banner --exit-code 1 .

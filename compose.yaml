# Local run of the web app against a local data folder (no GitHub, no Entra). For the hosted setup see docs/SETUP.md.
# Local dev mode: the browser is treated as an elevated admin with no sign-in. That is only safe because the port is
# published on the host's loopback (127.0.0.1) and nothing else; never change that to 0.0.0.0 or a LAN address.
services:
  hm360:
    build: .
    image: hm360:local
    container_name: hm360
    restart: unless-stopped
    ports:
      - "127.0.0.1:3460:3460"
    environment:
      NODE_ENV: development
      HM360_DEV_ADMIN: "1"
      HM360_DEV_ADMIN_CONTAINER: "1"
      HM360_DATA_DIR: /data/exchange
      HM360_PUBLIC_URL: http://localhost:3460
      HM360_ADPOSTURE_DIR: /data/adposture
      HM360_ATTACKPATHS_DIR: /data/attackpaths
      HM360_ENTRAPOSTURE_DIR: /data/entraposture
      HM360_M365POSTURE_DIR: /data/m365posture
    volumes:
      - ./data/exchange:/data/exchange
      # AD posture reports written by tools/adposture/Invoke-PingCastleScan.ps1 on the host; the app only reads them.
      - ./data/adposture:/data/adposture:ro
      # BloodHound summaries written by tools/bloodhound/Invoke-BloodHoundScan.ps1 on the host; read only here too.
      - ./data/attackpaths:/data/attackpaths:ro
      # Maester results written by tools/entraposture/Invoke-MaesterScan.ps1 on the host; read only here too.
      - ./data/entraposture:/data/entraposture:ro
      # Monkey365 results written by tools/m365posture/Invoke-Monkey365Scan.ps1 on the host; read only here too.
      - ./data/m365posture:/data/m365posture:ro
